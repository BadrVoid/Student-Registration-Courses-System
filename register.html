<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WEC | Student Registration</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar">
      <a href="index.html" class="brand"><span>WEC</span>University</a>
    </nav>

    <!-- Main Content -->
    <main
      class="container"
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      "
    >
      <div style="max-width: 580px; width: 100%">
        <div style="text-align: center; margin-bottom: 1.75rem">
          <h1 style="font-size: 1.9rem">Create Student Account</h1>
          <p style="color: var(--text-muted); font-size: 0.95rem">
            Register your academic profile to enroll in Fall 2026 courses
          </p>
        </div>

        <section class="card">
          <div class="card-header">
            <div>
              <span class="card-subtitle">STUDENT PROFILE</span>
              <h2 class="card-title">Account Registration</h2>
            </div>
          </div>

          <form action="#account-created">
            <div class="grid-2" style="gap: 0.75rem">
              <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input
                  type="text"
                  id="reg-name"
                  class="form-control"
                  placeholder="enter your name..."
                  required
                />
              </div>
              <div class="form-group">
                <label for="reg-id">University Student ID</label>
                <input
                  type="text"
                  id="reg-id"
                  class="form-control"
                  placeholder="20240512"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="reg-email">Academic Email Address</label>
              <input
                type="email"
                id="reg-email"
                class="form-control"
                placeholder="name@university.edu"
                required
              />
            </div>

            <div class="grid-2" style="gap: 0.75rem">
              <div class="form-group">
                <label for="reg-dept">Department / Major</label>
                <select id="reg-dept" class="form-control">
                  <option>Computer Engineering & AI</option>
                  <option>Computer Science</option>
                  <option>Information Systems</option>
                  <option>Software Engineering</option>
                </select>
              </div>
              <div class="form-group">
                <label for="reg-level">Academic Level</label>
                <select id="reg-level" class="form-control">
                  <option>Level 1</option>
                  <option selected>Level 2</option>
                  <option>Level 3</option>
                  <option>Level 4</option>
                </select>
              </div>
            </div>

            <div class="grid-2" style="gap: 0.75rem">
              <div class="form-group">
                <label for="reg-pass">Create Password</label>
                <input
                  type="password"
                  id="reg-pass"
                  class="form-control"
                  placeholder="Min. 8 characters"
                  required
                />
              </div>
              <div class="form-group">
                <label for="reg-confirm-pass">Confirm Password</label>
                <input
                  type="password"
                  id="reg-confirm-pass"
                  class="form-control"
                  placeholder="Re-enter password"
                  required
                />
              </div>
            </div>

            <a
              href="#account-created"
              class="btn btn-primary btn-block"
              style="margin-top: 0.75rem"
              >Register Student Account</a
            >
          </form>

          <div
            style="
              margin-top: 1.5rem;
              padding-top: 1.25rem;
              border-top: 1px solid var(--third-color);
              text-align: center;
              font-size: 0.9rem;
              color: var(--text-muted);
            "
          >
            Already have an account?
            <a
              href="index.html"
              style="
                color: var(--fourth-color);
                font-weight: 600;
                text-decoration: none;
                margin-left: 0.25rem;
              "
            >
              Back to Login</a
            >
          </div>
        </section>
      </div>
    </main>
  <footer>
    Student Course Registration System &bull; &commat; 2026
  </footer>
  </body>
</html>
