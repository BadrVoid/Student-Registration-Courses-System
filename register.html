<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WEC | Student Registration</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="brand"> <span>WEC</span>University </a>
    </nav>
    <main class="container auth-main">
      <div class="register-wrapper">
        <div class="auth-heading">
          <h1 class="auth-title">Create Student Account</h1>
          <p class="auth-description">
            Register your academic profile to enroll in Fall 2026 courses
          </p>
        </div>
        <section class="card">
          <div class="card-header">
            <div>
              <span class="card-subtitle">STUDENT PROFILE</span>
              <h2 class="card-title">Account Registration</h2>
            </div>
          </div>
          <form action="#account-created">
            <div class="grid-2 form-grid">
              <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input
                  type="text"
                  id="reg-name"
                  name="fullName"
                  class="form-control"
                  placeholder="Enter your name..."
                  autocomplete="name"
                  required
                />
              </div>
              <div class="form-group">
                <label for="reg-id">University Student ID</label>
                <input
                  type="text"
                  id="reg-id"
                  name="studentId"
                  class="form-control"
                  placeholder="20240512"
                  required
                />
              </div>
            </div>
            <div class="form-group">
              <label for="reg-email">Academic Email Address</label>
              <input
                type="email"
                id="reg-email"
                name="email"
                class="form-control"
                placeholder="name@university.edu"
                autocomplete="email"
                required
              />
            </div>
            <div class="grid-2 form-grid">
              <div class="form-group">
                <label for="reg-dept">Department / Major</label>
                <select
                  id="reg-dept"
                  name="department"
                  class="form-control"
                  required
                >
                  <option value="Computer Engineering & AI">
                    Computer Engineering & AI
                  </option>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Information Systems">
                    Information Systems
                  </option>
                  <option value="Software Engineering">
                    Software Engineering
                  </option>
                </select>
              </div>
              <div class="form-group">
                <label for="reg-level">Academic Level</label>
                <select
                  id="reg-level"
                  name="academicLevel"
                  class="form-control"
                  required
                >
                  <option value="Level 1">Level 1</option>
                  <option value="Level 2" selected>Level 2</option>
                  <option value="Level 3">Level 3</option>
                  <option value="Level 4">Level 4</option>
                </select>
              </div>
            </div>
            <div class="grid-2 form-grid">
              <div class="form-group">
                <label for="reg-pass">Create Password</label>
                <input
                  type="password"
                  id="reg-pass"
                  name="password"
                  class="form-control"
                  placeholder="Min. 8 characters"
                  minlength="8"
                  autocomplete="new-password"
                  required
                />
              </div>
              <div class="form-group">
                <label for="reg-confirm-pass">Confirm Password</label>
                <input
                  type="password"
                  id="reg-confirm-pass"
                  name="confirmPassword"
                  class="form-control"
                  placeholder="Re-enter password"
                  minlength="8"
                  autocomplete="new-password"
                  required
                />
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block form-submit">
              Register Student Account
            </button>
          </form>
          <div class="auth-bottom">
            Already have an account?
            <a href="index.html" class="auth-register-link"> Back to Login </a>
          </div>
        </section>
      </div>
    </main>
    <footer>Student Course Registration System &bull; &commat; 2026</footer>
  </body>
</html>
