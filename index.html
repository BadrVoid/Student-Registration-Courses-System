<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WEC | System Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="brand"> <span>WEC</span>University </a>
    </nav>
    <main class="container auth-main">
      <div class="auth-wrapper">
        <div class="auth-heading">
          <span >
            Fall Semester 2026
          </span>
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-description">Sign in to access your academic portal</p>
        </div>
        <section class="card">
          <div class="card-header">
            <div>
              <span class="card-subtitle">AUTHENTICATION</span>
            </div>
          </div>
          <form action="student-dashboard.html" method="get">
            <div class="form-group">
              <label for="login-id">University ID</label>
              <input
                type="text"
                id="login-id"
                name="universityId"
                class="form-control"
                placeholder="e.g. 202400189"
                required
              />
            </div>
            <div class="form-group">
              <label for="login-pass">Password</label>
              <input
                type="password"
                id="login-pass"
                name="password"
                class="form-control"
                placeholder="••••••••"
                required
              />
            </div>
            <div class="auth-actions">
              <a
                href="student-dashboard.html"
                class="btn btn-primary btn-block"
              >
                Login as Student
              </a>
              <a
                href="admin-dashboard.html"
                class="btn btn-secondary btn-block"
              >
                Login as Administrator
              </a>
            </div>
          </form>
          <div class="auth-bottom">
            Don't have a student account yet?
            <a href="register.html" class="auth-register-link">
              Create Account &rarr;
            </a>
          </div>
        </section>
      </div>
    </main>
    <footer>Student Course Registration System &bull; &commat; 2026</footer>
  </body>
</html>
