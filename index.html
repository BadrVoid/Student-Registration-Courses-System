<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WEC | System Login</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Navigation Bar -->
    <nav class="navbar">
      <a href="index.html" class="brand"> <span>WEC</span>University </a>
    </nav>

    <!-- Main Content -->
    <main class="container auth-main">
      <div class="auth-wrapper">
        <div class="auth-heading">
          <span class="badge badge-accent"> Fall Semester 2026 </span>

          <h1 class="auth-title">Welcome Back</h1>

          <p class="auth-description">Sign in to access your academic portal</p>
        </div>

        <section class="card">
          <div class="card-header">
            <div>
              <span class="card-subtitle"> AUTHENTICATION </span>
            </div>
          </div>

          <form action="student-dashboard.html" method="get">
            <div class="form-group">
              <label for="login-id">University ID</label>

              <input
                type="text"
                id="login-id"
                class="form-control"
                placeholder="e.g. 202400189"
                required
              />
            </div>

            <div class="form-group">
              <label for="login-pass">Password</label>

              <input
                type="password"
                id="login-pass"
                class="form-control"
                placeholder="••••••••"
                required
              />
            </div>

            <div class="auth-actions">
              <button type="submit" class="btn btn-primary btn-block">
                Login
              </button>
            </div>
          </form>

          <div class="auth-bottom">
            Don't have a student account yet?

            <a href="register.html" class="auth-register-link">
              Create Account &rarr;
            </a>
          </div>
        </section>
      </div>
    </main>

    <footer>Student Course Registration System &bull; @ 2026</footer>

    <script src="app.js"></script>
  </body>
</html>
